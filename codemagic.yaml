workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          cd SKRIVACI_ANDROID
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - SKRIVACI_ANDROID/app/build/outputs/apk/**/*.apk
