workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.md.skrivaci"
      node: latest
    triggering:
      events:
        - push
    scripts:
      - name: Build Android APK
        script: |
          cd SKRIVACI_ANDROID
          export JAVA_HOME=$JAVA_HOME_17
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME_17
    artifacts:
      - SKRIVACI_ANDROID/app/build/outputs/apk/**/*.apk
